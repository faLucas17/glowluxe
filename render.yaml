# Render > New > Blueprint > dépôt faLucas17/glowluxe : crée l'API + la base PostgreSQL.
services:
  - type: web
    name: glowluxe-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: starter            # 7 $/mois, ne s'endort pas (le plan free met ~50 s à se réveiller)
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glowluxe-db
          property: connectionString
      - key: SITE_URL
        sync: false          # ex : https://api.glowluxe.sn
      - key: APP_URL
        sync: false          # ex : https://glowluxe.sn (version web Cloudflare Pages)
      - key: ALLOWED_HOSTS
        sync: false          # ex : api.glowluxe.sn
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # ex : https://api.glowluxe.sn
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # ex : https://glowluxe.sn,https://glowluxe.pages.dev
      - key: ADMIN_URL
        sync: false          # ex : gestion-glowluxe-2026/
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SHOP_NOTIFICATION_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_WEBHOOK_SECRET
        sync: false
      - key: PAYTECH_API_KEY
        sync: false
      - key: PAYTECH_API_SECRET
        sync: false
      - key: PAYTECH_ENV
        value: test

databases:
  - name: glowluxe-db
    region: frankfurt
    plan: basic-256mb        # la base "free" de Render est supprimée après 30 jours
    databaseName: glowluxe
    user: glowluxe
