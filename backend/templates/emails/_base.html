{% load static %}<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlowLuxe</title></head>
<body style="margin:0;padding:0;background:#F6F1E8;font-family:Arial,Helvetica,sans-serif;color:#151311">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden">

<div style="color:#D4AF63;font-size:10px;letter-spacing:3px;margin-top:6px">LA MODE QUI RÉVÈLE VOTRE ÉCLAT</div></td></tr>

</table></td></tr></table></body></html>
